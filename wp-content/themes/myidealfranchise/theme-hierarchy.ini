/custom-theme/
│
├── style.css
├── functions.php
├── index.php
├── header.php
├── footer.php
├── front-page.php                   ← Home page (with hero + search)
├── single.php
├── archive.php
│
├── page.php                         ← Default page template
├── search.php                       ← Search results
│
├── page-templates/                  ← All individual custom page templates
│   ├── register.php                 ← Client registration page
│   ├── login.php                    ← Client login page
│   ├── dashboard.php                ← Client dashboard
│   ├── submit-franchise.php        ← Franchise submission form
│   ├── contact-us.php              ← Contact page
│   ├── about-us.php                ← About page
│   ├── request-valuation.php       ← CTA form page
│   └── learning-center.php         ← Educational content page
│
├── single-franchise.php            ← Franchise detail page
├── archive-franchise.php           ← Franchise listing loop
│
├── template-parts/                 ← Small reusable chunks
│   ├── header-nav.php              ← Main nav/header (with login/register buttons)
│   ├── hero.php                    ← Homepage hero section
│   ├── franchise-card.php          ← Card used in franchise loop
│   ├── search-bar.php              ← Homepage category/location filter
│   ├── footer-widgets.php          ← Footer blocks
│   └── modals/                     ← (optional) login/register modal windows
│
├── assets/
│   ├── css/
│   ├── js/
│   └── images/
│
├── includes/                       ← Logic-only PHP files
│   ├── custom-post-types.php       ← Registers `franchise` CPT
│   ├── form-handlers.php           ← Handles franchise submission
│   ├── user-auth.php               ← Registration/Login logic
│   ├── email-functions.php         ← Email triggers
│   └── enqueue-scripts.php         ← Register and enqueue all assets




